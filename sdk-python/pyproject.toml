[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veekshana"
version = "0.2.0"
description = "Open-source observability for AI agents: traces, costs, and evals."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "Veekshana contributors" }]
keywords = ["observability", "llm", "ai-agents", "tracing", "opentelemetry", "evals", "anthropic", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/TSRCHARAN/veekshana"
Repository = "https://github.com/TSRCHARAN/veekshana"
Documentation = "https://github.com/TSRCHARAN/veekshana/blob/main/docs/GUIDE.md"
Issues = "https://github.com/TSRCHARAN/veekshana/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.0"]

[tool.setuptools.packages.find]
include = ["veekshana*"]
