name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packages
        run: pip install -e sdk-python -e server anthropic openai
      - name: Import smoke test
        run: |
          python -c "
          import veekshana
          import veekshana_server.main
          from veekshana.cost import compute_cost
          assert compute_cost('claude-sonnet-5-5', 1000, 1000) == 0.012
          print('imports + cost table OK')
          "
      - name: End-to-end smoke test
        run: |
          veekshana-server &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8787/health && break; sleep 1; done
          python examples/toy_agent.py
          veekshana-eval --mock
          TRACES=$(curl -sf -H "x-api-key: dev-key" "http://127.0.0.1:8787/api/v1/traces" | python -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "traces ingested: $TRACES"
          test "$TRACES" -ge 5
      - name: Offline end-to-end tests (mock providers, no keys)
        run: |
          python tests/test_streaming.py
          python tests/test_gateway.py
          cd sdk-ts && npm install && npm run build && cd ..
          python tests/test_ts_sdk.py
      - name: Build + validate distributions
        run: |
          pip install build twine
          python -m build sdk-python
          python -m build server
          twine check sdk-python/dist/* server/dist/*

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
