[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti-server"
version = "0.1.0"
description = "Drishti server: ingestion + query API for AI agent observability."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "opentelemetry-proto>=1.25",
    "protobuf>=4.25",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
evals = ["anthropic>=0.30"]

[project.scripts]
drishti-server = "drishti_server.main:run"
drishti-eval = "drishti_server.evals:main"

[tool.setuptools.packages.find]
include = ["drishti_server*"]
