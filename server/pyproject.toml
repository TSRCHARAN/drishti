[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veekshana-server"
version = "0.1.0"
description = "Veekshana server: ingestion + query API for AI agent observability."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Veekshana contributors" }]
keywords = ["observability", "llm", "ai-agents", "tracing", "opentelemetry", "evals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "httpx>=0.24",
    "opentelemetry-proto>=1.25",
    "protobuf>=4.25",
]

[project.urls]
Homepage = "https://github.com/TSRCHARAN/veekshana"
Repository = "https://github.com/TSRCHARAN/veekshana"
Documentation = "https://github.com/TSRCHARAN/veekshana/blob/main/docs/GUIDE.md"
Issues = "https://github.com/TSRCHARAN/veekshana/issues"

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
evals = ["anthropic>=0.30", "openai>=1.0"]

[project.scripts]
veekshana-server = "veekshana_server.main:run"
veekshana-eval = "veekshana_server.evals:main"

[tool.setuptools.packages.find]
include = ["veekshana_server*"]
