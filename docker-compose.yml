# Veekshana self-host: `docker compose up` → API on :8787, UI on :3000.
#
# Change the API key for anything beyond local use:
#   VEEKSHANA_API_KEY=your-secret docker compose up --build
# (The web image bakes NEXT_PUBLIC_* at build time, so pass the same key there.)

services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    ports:
      - "8787:8787"
    environment:
      VEEKSHANA_API_KEY: ${VEEKSHANA_API_KEY:-dev-key}
      # SQLite on a named volume by default. For Postgres, uncomment the
      # postgres service below and this URL:
      # VEEKSHANA_DATABASE_URL: postgresql+psycopg2://veekshana:veekshana@postgres:5432/veekshana
      VEEKSHANA_CORS_ORIGINS: ${VEEKSHANA_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - veekshana-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_VEEKSHANA_HOST: ${VEEKSHANA_PUBLIC_HOST:-http://localhost:8787}
        NEXT_PUBLIC_VEEKSHANA_API_KEY: ${VEEKSHANA_API_KEY:-dev-key}
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy

  # Optional Postgres (uncomment, plus the VEEKSHANA_DATABASE_URL above):
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: veekshana
  #     POSTGRES_PASSWORD: veekshana
  #     POSTGRES_DB: veekshana
  #   volumes:
  #     - veekshana-pg:/var/lib/postgresql/data

volumes:
  veekshana-data:
  # veekshana-pg:
